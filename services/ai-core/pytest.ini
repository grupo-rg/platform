[pytest]
pythonpath = .

markers =
    firestore: requires Firestore emulator (skipped by default; set FIRESTORE_EMULATOR_HOST to enable)
    e2e: end-to-end pipeline test (slow; requires emulator + LLM fixtures)
    cloud: hits real cloud services (skipped in CI by default)
    golden: integration tests que requieren PDFs golden cliente (no commiteados)
    bc3: tests del parser BC3 (FIEBDC-3) con fixtures reales del cliente

asyncio_mode = auto
